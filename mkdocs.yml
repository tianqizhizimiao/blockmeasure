site_name: blockmeasure
site_description: 从深度相机点云或深度帧测量托盘上物块的颜色、长×宽×高，以及物块在托盘坐标系中的位置
site_url: https://tianqizhizimiao.github.io/blockmeasure/
repo_url: https://github.com/tianqizhizimiao/blockmeasure
repo_name: tianqizhizimiao/blockmeasure
edit_uri: edit/main/docs/
copyright: MIT License · TqZzMiao

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 命令行: cli.md
  - 常见问题: faq.md
  - API 参考: api.md
  - 更新日志: changelog.md

plugins:
  - search:
      lang: zh
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["."]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tianqizhizimiao/blockmeasure
