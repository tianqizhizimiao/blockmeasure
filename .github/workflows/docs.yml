name: Docs

# 构建文档站并部署到 GitHub Pages。
#
# 前置（只需在 GitHub 网页做一次）：
#   Settings -> Pages -> Build and deployment -> Source 选 "GitHub Actions"
# 未开启时本 workflow 的 deploy 步骤会失败（build 步骤仍会正常校验文档）。

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 允许并发部署排队，但不取消进行中的部署（避免站点处于半发布状态）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装文档依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      # --strict：断链、缺失锚点、docstring 解析告警一律当错误
      - name: 构建文档站
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
